name: atlas-knowledge-demo
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: atlas-knowledge-demo-neo4j
    ports:
      - "127.0.0.1:17693:7687"
      - "127.0.0.1:17493:7474"
    environment:
      NEO4J_AUTH: "neo4j/${KD_NEO4J_PASSWORD:-atlas-demo-local}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - demo-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  pending-neo4j:
    image: neo4j:5.26-community
    container_name: atlas-knowledge-demo-pending-neo4j
    ports:
      - "127.0.0.1:17695:7687"
      - "127.0.0.1:17495:7474"
    environment:
      NEO4J_AUTH: "neo4j/${KD_NEO4J_PASSWORD:-atlas-demo-local}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - demo-pending-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  demo-neo4j:
  demo-pending-neo4j:

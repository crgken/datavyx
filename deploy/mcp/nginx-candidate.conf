# Include inside the existing HTTPS server only after nginx -t.
# Does not replace old webpage/API or the production /mcp location.
location = /mcp-candidate {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 60s;
    access_log off;
}
location = /.well-known/oauth-protected-resource/mcp-candidate {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    access_log off;
}

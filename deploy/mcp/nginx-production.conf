# Final cutover fragment: replace overlapping old API/web locations after authorization.
location = /mcp {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 60s;
    access_log off;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    access_log off;
}
# All old backend routes must be retired, not merely the old chat widget.
location ^~ /api/ { return 410; }
location = /sw.js { add_header Cache-Control "no-store" always; return 410; }
location = /flutter_service_worker.js { add_header Cache-Control "no-store" always; return 410; }
location / {
    root /opt/atlasai-mcp/current/deploy/mcp;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-store" always;
}
